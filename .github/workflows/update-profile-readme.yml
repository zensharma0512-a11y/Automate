name: Update profile README

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/github_api.py
      - scripts/update_readme.py
      - .github/workflows/update-profile-readme.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_PROFILE_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN != '' }}
      # Without the token (or on pull requests) the job only shows what it would change.
      DRY_RUN_FLAG: ${{ (github.event_name == 'pull_request' || secrets.PROFILE_REPO_TOKEN == '') && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the profile repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}
          token: ${{ secrets.PROFILE_REPO_TOKEN || github.token }}
          path: profile

      - name: Refresh README sections
        run: python3 scripts/update_readme.py profile/README.md $DRY_RUN_FLAG
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push the update
        if: github.event_name != 'pull_request' && env.HAS_PROFILE_TOKEN == 'true'
        working-directory: profile
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh projects and activity"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Remind about the token
        if: env.HAS_PROFILE_TOKEN != 'true'
        run: echo "::warning::Add a PROFILE_REPO_TOKEN secret so this workflow can update your profile README. See README.md."
